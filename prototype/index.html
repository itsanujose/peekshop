<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeekShop prototype</title>
<style>
:root{--bg:#F6FBF8;--card:#FFFFFF;--line:#D5E6DD;--ink:#0B2E2B;--slate:#3F5E59;--brand:#0E7C59;--on-brand:#FFFFFF;--amber:#FFB020;--ok-bg:#E3F5EC;--ok-fg:#0A5C42;--warn-bg:#FFF0D1;--warn-fg:#7A4A00;--out-bg:#EEF2F0;--out-fg:#3F5E59;--page:#E4EFE9;--shadow:rgba(11,46,43,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F1D;--card:#12302D;--line:#25504B;--ink:#EAF7F1;--slate:#A9C7BE;--brand:#3DD49A;--on-brand:#0B2E2B;--ok-bg:#134B3B;--ok-fg:#8FE9C4;--warn-bg:#4A3600;--warn-fg:#FFD27A;--out-bg:#1D3633;--out-fg:#A9C7BE;--page:#061513;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1F1D;--card:#12302D;--line:#25504B;--ink:#EAF7F1;--slate:#A9C7BE;--brand:#3DD49A;--on-brand:#0B2E2B;--ok-bg:#134B3B;--ok-fg:#8FE9C4;--warn-bg:#4A3600;--warn-fg:#FFD27A;--out-bg:#1D3633;--out-fg:#A9C7BE;--page:#061513;--shadow:rgba(0,0,0,.5);color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.cap{font-size:13px;font-weight:500;color:var(--slate);text-align:center;max-width:420px;line-height:1.5}
.phone{position:relative;width:402px;max-width:100%;height:min(874px,calc(100dvh - 96px));background:var(--bg);border-radius:54px;border:10px solid #101716;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 2px #3A4644,0 30px 70px var(--shadow)}
.status{flex:none;height:46px;padding:4px 28px 0 32px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;color:var(--ink);background:var(--bg)}
.island{position:absolute;left:50%;top:10px;width:96px;height:26px;margin-left:-48px;border-radius:14px;background:#101716;z-index:5}
.homebar{flex:none;height:24px;display:flex;align-items:flex-start;justify-content:center}
.homebar i{display:block;width:120px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;margin-top:8px}
@media (max-width:480px){.stage{padding:0;gap:0;justify-content:flex-start}.cap{display:none}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.status,.island,.homebar{display:none}}
#screen{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.pad{padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px}
.h1{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.h2{font-size:18px;font-weight:700}
.muted{color:var(--slate);font-weight:500}
.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(11,46,43,.06),0 6px 16px rgba(11,46,43,.06)}
.row{display:flex;flex-direction:row;align-items:center}
.col{display:flex;flex-direction:column}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.grow{flex:1 1 0;min-width:0}
.btn{min-height:56px;border-radius:16px;background:var(--brand);color:var(--on-brand);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;width:100%}
.btn.sec{background:var(--card);color:var(--brand);border:2px solid var(--brand)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--slate);font-weight:600;font-size:14px;width:100%}
.chips{display:flex;flex-direction:row;gap:8px;overflow-x:auto;padding-bottom:2px}
.fc{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;display:flex;align-items:center}
.fc.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}
.chip{display:inline-block;border-radius:12px;font-size:12px;font-weight:600;padding:6px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg)}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip.out{background:var(--out-bg);color:var(--out-fg)}
.search{min-height:56px;width:100%;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:0 16px;display:flex;flex-direction:row;align-items:center;gap:12px;font-size:15px;font-weight:500;color:var(--slate)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;font-weight:500;color:var(--ink);min-height:44px}
.search:focus-within{border-color:var(--brand);outline:2px solid var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;overflow:hidden;height:96px;border-radius:18px;display:flex;align-items:center;justify-content:center}
img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pcard{display:flex;flex-direction:column;gap:8px;width:100%}
.iconbtn{flex:none;width:44px;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.tabs{flex:none;height:72px;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:row}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--slate);text-align:center}
.tab.on{color:var(--brand);font-weight:600}
.tab svg{stroke:currentColor}
.mark .hs{fill:none;stroke:var(--brand)}.mark .bf{fill:var(--brand);stroke:none}
.stroke{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dim{opacity:.55}
.sheet{background:var(--card);border-radius:28px 28px 0 0;padding:16px 20px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 24px var(--shadow)}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
.bars{display:flex;flex-direction:row;align-items:flex-end;gap:4px;height:32px}
.bars i{display:block;width:10px;border-radius:3px;background:var(--line)}
.bars i.f{background:var(--brand)}
.banner{border-radius:14px;background:var(--ok-bg);color:var(--ok-fg);padding:12px 14px;font-size:13px;font-weight:500;line-height:1.5}
.sr{position:absolute;left:-9999px}
.fi{min-height:52px;width:100%;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;font-weight:500;color:var(--ink)}
.fi:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.err{border-radius:14px;background:var(--warn-bg);color:var(--warn-fg);padding:12px 14px;font-size:13px;font-weight:600;line-height:1.5}
.pw{position:relative;display:block}
.pw .fi{padding-right:56px}
.pw button{position:absolute;right:4px;top:4px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--slate)}
</style>
</head>

(others.length ? '<div><div class="h2" style="margin-bottom:8px">Also in stock here</div><div class="chips">' + others.map(function (q) { return '<button class="fc" data-act="swap" data-id="' + q.id + '">' + q.name + '</button>'; }).join('') + '</div></div>' : '') +
'<div class="row gap12"><button class="btn' + (res ? ' dark' : '') + '" data-act="reserve"' + (st.qty === 0 || !s.open ? ' disabled' : '') + ' style="flex:1 1 0">' + (!s.open ? 'Closed now' : (st.qty === 0 ? 'Out of stock' : (res ? 'Reserved · tap to cancel' : 'Reserve for 1 hour'))) + '</button><button class="btn sec" data-act="directions" style="flex:1 1 0">Get directions</button></div>' +
(res ? '<div class="banner">Held for you until ' + hold + '. Show this code at the counter: <b>' + code(p.id, s.id) + '</b> (sample code).</div>' : '') + '</div>';
}

function mapScreen() {
var s = byId(STORES, state.sid), p = byId(PRODUCTS, state.pid), st = stockOf(p.id, s.id);
var steps = ['Head toward the park (' + Math.round(s.km * 400) + ' m)', 'Turn right at the crossing (' + Math.round(s.km * 400) + ' m)', 'Arrive at ' + s.name];
var pins = STORES.map(function (t) {
var sel = t.id === s.id, sc = sel ? 1.25 : 0.85, fill = sel ? '#0E7C59' : '#3F5E59';
return '<g data-act="pin" data-id="' + t.id + '" tabindex="0" role="button" aria-label="' + t.name + ', ' + t.km + ' km" transform="translate(' + t.x + ',' + (t.y + 6) + ') scale(' + sc + ')" style="cursor:pointer"><path d="M0 0 c-14 -16 -22 -26 -22 -38 a22 22 0 1 1 44 0 c0 12 -8 22 -22 38z" fill="' + fill + '"/><circle cx="0" cy="-38" r="9" fill="#FFFFFF"/>' + (sel ? '<circle cx="0" cy="-38" r="3.6" fill="#0B2E2B"/>' : '') + '</g>';
}).join('');
var route = state.navStep >= 0 ? '<path d="M110 520 L140 520 L140 390 L' + s.x + ' 390 L' + s.x + ' ' + (s.y + 4) + '" fill="none" stroke="#0E7C59" stroke-width="6" stroke-dasharray="2 10" stroke-linecap="round"/>' : '';
var nav;
if (state.navStep < 0) {
nav = '<button class="btn" data-act="startnav">Start walking directions</button>';
} else if (state.navStep < steps.length - 1) {
nav = '<div class="card" style="font-weight:600">Step ' + (state.navStep + 1) + ' of ' + steps.length + ': ' + steps[state.navStep] + '</div><div class="row gap12"><button class="btn dark" data-act="next" style="flex:1 1 0">Next step</button><button class="btn sec" data-act="stopnav" style="flex:1 1 0">Stop</button></div>';
} else {
nav = '<div class="banner"><b>You’ve arrived at ' + s.name + '.</b> ' + (state.reserved[p.id + s.id] ? 'Show your code ' + code(p.id, s.id) + ' at the counter.' : 'Find ' + p.name + ' in aisle ' + st.aisle + ', ' + shelfText(st) + '.') + '</div><button class="btn" data-act="backToStore">View store details</button>';
}
return '<div style="position:relative;flex:1;min-height:0;background:#EAF1EC"><svg width="100%" height="100%" viewBox="0 0 390 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of nearby stores" style="position:absolute;left:0;top:0"><rect width="390" height="600" fill="#EAF1EC"/><g transform="translate(0,-60)"><rect x="20" y="120" width="110" height="90" rx="10" fill="#DCE9E0"/><rect x="150" y="120" width="90" height="90" rx="10" fill="#DCE9E0"/><rect x="260" y="110" width="110" height="110" rx="10" fill="#DCE9E0"/><rect x="20" y="250" width="110" height="130" rx="10" fill="#DCE9E0"/><rect x="260" y="260" width="110" height="100" rx="10" fill="#DCE9E0"/><rect x="20" y="410" width="80" height="120" rx="10" fill="#DCE9E0"/><rect x="130" y="410" width="110" height="100" rx="10" fill="#DCE9E0"/><rect x="270" y="400" width="100" height="130" rx="10" fill="#DCE9E0"/><ellipse cx="195" cy="310" rx="52" ry="40" fill="#BFE6D0"/><path d="M-10 560 C 90 520, 180 600, 400 540" fill="none" stroke="#CFE3EE" stroke-width="30"/><path d="M0 230 H390 M0 390 H390 M140 90 V560 M250 90 V560" stroke="#FFFFFF" stroke-width="12"/><text x="168" y="318" font-size="11" font-weight="700" fill="#3C7A5E" font-family="Arial,Helvetica,sans-serif">Park</text><text x="28" y="548" font-size="11" font-weight="700" fill="#4F7F93" font-family="Arial,Helvetica,sans-serif">Canal</text><text x="124" y="526" font-size="11" font-weight="700" fill="#0B2E2B" font-family="Arial,Helvetica,sans-serif">You</text>' + route + pins + '<circle cx="110" cy="520" r="16" fill="#0B2E2B" opacity=".15"/><circle cx="110" cy="520" r="8" fill="#0B2E2B" stroke="#FFFFFF" stroke-width="3"/></g></svg>' +
'<div style="position:absolute;left:16px;top:16px;right:16px" class="row gap8">' + backBtn() + '<div class="search grow" style="min-height:48px;border-radius:24px;color:var(--ink);font-size:14px;font-weight:600">' + p.name + ', ' + p.size + '</div></div></div>' +
'<div class="sheet"><div class="grab"></div><div class="row" style="justify-content:space-between;gap:12px"><div><div style="font-size:20px;font-weight:700">' + s.name + '</div><div class="muted" style="font-size:14px">' + walkMin(s.km) + ' min walk · ' + s.km + ' km · ' + s.hours + '</div></div>' + stockChip(st.qty) + '</div><div class="muted sm">' + CROWD[s.crowd] + ' right now' + (st.qty > 0 ? ' · Aisle ' + st.aisle + ', ' + shelfText(st) : '') + '</div>' + nav + '</div>';
}

function saved() {
var ss = STORES.filter(function (s) { return state.savedStores[s.id]; });
var ps = PRODUCTS.filter(function (p) { return state.savedProducts[p.id]; });
var empty = '<div class="card muted" style="text-align:center">Nothing saved yet. Tap the heart on a store or product to keep it here.</div>';
return '<div class="pad"><div class="row" style="justify-content:space-between"><div class="h2" style="font-size:24px">Saved</div>' + logoutBtn() + '</div><div class="h2">Stores</div>' + (ss.length ? ss.map(function (s) {
return '<button class="card row gap12" data-act="storeFromHome" data-id="' + s.id + '" style="width:100%">' + shop(s, 52) + '<div class="grow"><div style="font-size:15px;font-weight:600">' + s.name + '</div><div class="muted sm">' + s.km + ' km · ' + s.hours + '</div></div>' + crowdChip(s.crowd) + '</button>';
}).join('') : empty) + '<div class="h2">Products</div>' + (ps.length ? ps.map(function (p) {
return '<button class="card row gap12" data-act="pick" data-id="' + p.id + '" style="width:100%"><div class="tile" style="width:56px;height:56px;border-radius:14px;flex:none;background:' + p.tile + '">' + art(p.id, 40, p.name) + ph(p.id) + '</div><div class="grow"><div style="font-size:15px;font-weight:600">' + p.name + ', ' + p.size + '</div><div class="muted sm">In stock at ' + inStockCount(p.id) + ' stores</div></div></button>';
}).join('') : empty) + '</div>';
}

function logoutBtn() { return '<button class="iconbtn" data-act="logout" aria-label="Log out" title="Log out">' + ico('logout') + '</button>'; }
function findUser(email) { for (var i = 0; i < USERS.length; i++) { if (USERS[i].email === email) return USERS[i]; } return null; }
function authScreen(mode) {
var login = mode === 'login', f = state.form;
var nameField = login ? '' : '<label class="col gap8" for="f-name"><span style="font-size:14px;font-weight:600">Your name</span><input class="fi" id="f-name" type="text" value="' + esc(f.name) + '" autocomplete="name"></label>';
var emailField = '<label class="col gap8" for="f-email"><span style="font-size:14px;font-weight:600">Email</span><input class="fi" id="f-email" type="email" value="' + esc(f.email) + '" autocomplete="email" inputmode="email"></label>';
var pwField = '<label class="col gap8" for="f-pw"><span style="font-size:14px;font-weight:600">Password</span><span class="pw"><input class="fi" id="f-pw" type="' + (state.showPw ? 'text' : 'password') + '" value="' + esc(f.password) + '" autocomplete="' + (login ? 'current-password' : 'new-password') + '"><button type="button" data-act="togglePw" aria-label="' + (state.showPw ? 'Hide password' : 'Show password') + '">' + ico(state.showPw ? 'eyeoff' : 'eye') + '</button></span></label>';
return '<div class="pad"><div class="row gap8">' + backBtn() + '<div class="h2" style="font-size:24px">' + (login ? 'Welcome back' : 'Create your account') + '</div></div><div class="muted" style="font-size:15px;line-height:1.5">' + (login ? 'Log in to see live stock at stores near you.' : 'It only takes a few seconds. This is a prototype, so nothing is stored.') + '</div>' + nameField + emailField + pwField + (state.err ? '<div class="err" role="alert">' + esc(state.err) + '</div>' : '') + '<button class="btn" data-act="submitAuth">' + (login ? 'Log in' : 'Create account') + '</button>' + (login ? '<button class="btn sec" data-act="useDemo" style="min-height:48px;font-size:15px">Use demo account details</button>' : '') + '<button class="link" data-act="' + (login ? 'goSignup' : 'goLogin') + '">' + (login ? 'New to PeekShop? Create an account' : 'Already have an account? Log in') + '</button></div>';
}
function submitAuth() {
var f = state.form, email = f.email.trim().toLowerCase(), u = null;
if (state.screen === 'signup') {
if (!f.name.trim()) { state.err = 'Please enter your name.'; render(); return; }
if (email.indexOf('@') < 1 || email.indexOf('.') < 0) { state.err = 'Please enter a valid email address.'; render(); return; }
if (f.password.length < 6) { state.err = 'Use at least 6 characters for your password.'; render(); return; }
if (findUser(email)) { state.err = 'An account with this email already exists. Try logging in.'; render(); return; }
u = { name: f.name.trim(), email: email, password: f.password };
USERS.push(u);
} else {
u = findUser(email);
if (!u || u.password !== f.password) { state.err = 'That email and password don’t match. Check your details or use the demo account.'; render(); return; }
}
state.user = u; state.err = ''; state.notice = ''; state.form = { name: '', email: '', password: '' }; state.showPw = false;
hist.length = 0; state.screen = 'home'; render();
}
function logout() {
state.user = null; state.notice = 'You’ve been logged out.'; state.err = '';
state.savedStores = {}; state.savedProducts = {}; state.reserved = {};
state.sid = null; state.pid = null; state.query = ''; state.cat = 'All'; state.navStep = -1;
state.f = { stock: true, open: false, near: false, quiet: false };
hist.length = 0; state.screen = 'welcome'; render();
}

/* ---------- render ---------- */
var TABS = [['home', 'Home'], ['search', 'Search'], ['map', 'Map'], ['saved', 'Saved']];
var WITH_TABS = { home: 1, search: 1, results: 1, saved: 1 };
function activeTab() { return state.screen === 'results' ? 'search' : state.screen; }

function render() {
if (!state.user && ['splash', 'welcome', 'login', 'signup'].indexOf(state.screen) === -1) { state.screen = 'welcome'; }
var el = document.getElementById('screen');
var keep = lastScreen === state.screen ? el.scrollTop : 0;
var fn = { splash: splash, welcome: welcome, login: function () { return authScreen('login'); }, signup: function () { return authScreen('signup'); }, home: home, search: search, results: results, store: store, map: mapScreen, saved: saved }[state.screen];
el.innerHTML = fn();
el.scrollTop = keep;
lastScreen = state.screen;
var tabs = document.getElementById('tabs');
if (WITH_TABS[state.screen]) {
tabs.style.display = 'flex';
tabs.innerHTML = TABS.map(function (t) {
return '<button class="tab' + (t[0] === activeTab() ? ' on' : '') + '" data-act="tab" data-id="' + t[0] + '"' + (t[0] === activeTab() ? ' aria-current="page"' : '') + '>' + ico(t[0]) + t[1] + '</button>';
}).join('');
} else { tabs.style.display = 'none'; }
var hb = document.getElementById('homebar'); if (hb) { hb.style.background = (WITH_TABS[state.screen] || state.screen === 'map') ? 'var(--card)' : 'var(--bg)'; }
if (state.screen === 'search' && !keep) { var q = document.getElementById('q'); if (q) q.focus(); }
}
function go(s) { if (s !== state.screen) hist.push(state.screen); state.screen = s; state.navStep = -1; render(); }
function toTab(t) {
hist.length = 0;
if (t === 'map') {
if (!state.sid) state.sid = 's1';
if (!state.pid) state.pid = bestProductAt(state.sid);
}
state.screen = t; state.navStep = -1; render();
}

function act(a, id) {
var steps;
switch (a) {
case 'start': state.loc = id === 'allow' ? 'Neukölln, Berlin' : 'Berlin'; hist.length = 0; state.screen = 'home'; render(); break;
case 'goLogin': state.err = ''; state.notice = ''; go('login'); break;
case 'goSignup': state.err = ''; state.notice = ''; go('signup'); break;
case 'useDemo': state.form = { name: '', email: DEMO.email, password: DEMO.password }; state.err = ''; state.notice = ''; if (state.screen !== 'login') { go('login'); } else { render(); } break;
case 'togglePw': state.showPw = !state.showPw; render(); break;
case 'submitAuth': submitAuth(); break;
case 'logout': logout(); break;
case 'tab': toTab(id); break;
case 'cat': state.cat = id; render(); break;
case 'pick': state.pid = id; state.query = byId(PRODUCTS, id).name; go('results'); break;
case 'alt': state.pid = id; render(); break;
case 'filter': state.f[id] = !state.f[id]; render(); break;
case 'resetFilters': state.f = { stock: false, open: false, near: false, quiet: false }; render(); break;
case 'store': state.sid = id; go('store'); break;
case 'storeFromHome': state.sid = id; state.pid = bestProductAt(id); go('store'); break;
case 'swap': state.pid = id; render(); break;
case 'saveStore': state.savedStores[state.sid] = !state.savedStores[state.sid]; render(); break;
case 'saveProduct': state.savedProducts[state.pid] = !state.savedProducts[state.pid]; render(); break;
case 'reserve': var k = state.pid + state.sid; state.reserved[k] = !state.reserved[k]; render(); break;
case 'directions': go('map'); break;
case 'backToStore': hist.pop(); state.screen = 'store'; state.navStep = -1; render(); break;
case 'pin': state.sid = id; state.navStep = -1; render(); break;
case 'startnav': state.navStep = 0; render(); break;
case 'next': steps = 3; if (state.navStep < steps - 1) state.navStep++; render(); break;
case 'stopnav': state.navStep = -1; render(); break;
case 'back': state.screen = hist.pop() || 'home'; state.navStep = -1; render(); break;
}
}

document.addEventListener('click', function (e) {
var b = e.target.closest('[data-act]');
if (b && !b.disabled) act(b.getAttribute('data-act'), b.getAttribute('data-id'));
});
document.addEventListener('keydown', function (e) {
if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')) {
e.preventDefault(); act(e.target.getAttribute('data-act'), e.target.getAttribute('data-id'));
}
if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('fi')) { e.preventDefault(); act('submitAuth'); return; }
if (e.key === 'Enter' && e.target.id === 'q') {
var m = matches();
if (m.length) act('pick', m[0].id);
}
});
document.addEventListener('input', function (e) {
if (e.target.id === 'f-name') state.form.name = e.target.value;
if (e.target.id === 'f-email') state.form.email = e.target.value;
if (e.target.id === 'f-pw') state.form.password = e.target.value;
if (e.target.id === 'q') {
state.query = e.target.value;
document.getElementById('sugg').innerHTML = suggestions();
}
});

document.addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'IMG' && t.classList.contains('ph')) t.parentNode.removeChild(t); }, true);
render();
setTimeout(function () { if (state.screen === 'splash') { state.screen = 'welcome'; render(); } }, 1400);
})();
</script>
</body>
</html>
